# ESPHome config for Modułowo MOD-35 (DS2482-100 I2C → 1-Wire, 8x RJ45)
# Target: ESP32-C3 SuperMini (small enough for the enclosure). Any ESP32 works —
# change `board:` and the SDA/SCL pins below.
#
# Wiring (MOD-35 JP3 header → ESP32-C3 SuperMini):
#   GND → GND
#   VCC → 3V3   (NOT 5V: the module's 10k I2C pull-ups go to VCC, and the ESP32 is 3.3 V only)
#   SDA → GPIO6
#   SCL → GPIO7
# The board already has 10k pull-ups on SDA/SCL (R6/R7) and 4k7 on the 1-Wire line (R11),
# so nothing else is needed. RJ45 pinout per the manual: pin 2 = +VCC, pin 4 = 1-Wire,
# pins 1/3/5/8 = GND.
#
# First boot: leave the `sensor:` block as-is, watch the logs for
#   [I][one_wire:xxx]: Found device 0x28xxxxxxxxxxxxxx
# and paste the addresses into the dallas_temp entries.

substitutions:
  name: mod35-1wire
  friendly_name: "1-Wire hub (MOD-35)"
  sda: GPIO6
  scl: GPIO7

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1   # works for the C3 SuperMini
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

captive_portal:

i2c:
  sda: ${sda}
  scl: ${scl}
  frequency: 100kHz
  scan: true            # logs every I2C address found; the DS2482 shows up as 0x18–0x1B

# The MOD-35 has a single-channel DS2482 (all 8 RJ45 jacks sit on the same 1-Wire bus).
# The JP1/JP4/JP5/JP2 jumpers set AD0/AD1 → address 0x18..0x1B. If the i2c scan shows
# something other than 0x18, change `address:` here.
ds248x:
  - id: mod35
    type: ds2482-100
    address: 0x18
    active_pullup: true   # helps with the long cable runs RJ45 patching tends to produce

one_wire:
  - platform: ds248x
    ds248x_id: mod35
    id: ow_bus

sensor:
  # Replace the addresses with what the log shows. Add one entry per DS18B20.
  - platform: dallas_temp
    one_wire_id: ow_bus
    address: 0x0000000000000000
    name: "Sensor 1"
    update_interval: 30s
    resolution: 12
    filters:
      - filter_out: nan
  # - platform: dallas_temp
  #   one_wire_id: ow_bus
  #   address: 0x...
  #   name: "Sensor 2"
  #   update_interval: 30s

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

button:
  - platform: restart
    name: "Restart"
